<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>19b · How to play (lines)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="screens.css">
<script src="hexgrid.js"></script>
<script>window.HOWTO = "lines";</script>
<script src="howto.js"></script>
<style>
  /* One short modal per variant, in both languages (team decision of 2026-11-23). It opens the first time a variant is played
     and from Pause → Cómo jugar; in Hexa Fit it stops the clock and hides the board, like the pause menu. */
  .behind { position: absolute; inset: 0; width: 390px; height: 844px; border: 0; pointer-events: none; }
  .sheet { top: 108px; gap: 14px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip.clock { color: var(--secondary); border-color: var(--secondary); }
  .steps { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .step { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--well); border: 1.5px solid var(--line); }
  .step .pic { width: 64px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; }
  .step .n { font: 700 13px/1 var(--font-display); color: var(--accent); letter-spacing: 1px; }
  .step .t-body { font-size: 15px; line-height: 1.35; }
  .stars-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 1.5px dashed var(--line-strong); }
  .stars-row > span:first-child { display: flex; gap: 2px; flex: none; }
  .stars-row .t-body { font-size: 14px; color: var(--text-muted); }
  .step .mult { font: 700 26px/1 var(--font-display); color: var(--accent); }
  .step .pair { display: flex; align-items: center; gap: 2px; } .step .pair b { color: var(--text-muted); font-size: 14px; }
  .note { font-size: 13px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<iframe class="behind" title="Partida en curso"></iframe>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-label="Cómo jugar Hexa Fit">
  <div class="head">
    <div class="t-h1" style="font-size:26px">Cómo jugar</div>
    <span class="chip clock"><span data-icon="pause" style="width:14px;height:14px;display:inline-flex"></span>Reloj en pausa</span>
  </div>
  <div class="t-h2 gname" style="color:var(--accent); margin-top:-8px">Hexa Fit</div>
  <ol class="steps"></ol>
  <div class="stars-row"><span data-stars="3/3" data-size="18"></span><div class="t-body">1 estrella por ganar, +1 si no pasas los movimientos y +1 si no pasas el tiempo.</div></div>
  <span class="btn btn-primary">Entendido</span>
  <div class="note"></div>
</div>
<div class="home-indicator"></div>

</body>
</html>
