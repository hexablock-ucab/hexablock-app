<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>03 · Selector de niveles (Hexa Fit)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="screens.css">
<script src="hexgrid.js"></script>
<style>
  /* The same screen serves Hexa Fit and Hexa Sort: only --accent and the data change. */
  body { --accent: var(--variant-fit); }
  .progress { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .progress .row { display: flex; justify-content: space-between; align-items: baseline; }
  .bar { height: 10px; border-radius: 999px; background: rgba(10,14,40,0.7); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 40%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #D7B8FF); box-shadow: 0 0 12px var(--accent); }
  .comb { position: relative; flex: 1; margin-top: 8px; }
  .lvl { position: absolute; width: 84px; height: 97px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .lvl svg.bg { position: absolute; inset: 0; width: 84px; height: 97px; }
  .lvl .n { position: relative; font: 700 26px/1 var(--font-display); }
  .lvl .stars { position: relative; display: flex; gap: 1px; margin-top: 5px; }
  .lvl .stars svg { width: 14px; height: 14px; }
  .lvl.next { filter: drop-shadow(0 0 16px rgba(255,210,60,0.65)); }
  .stars-total { display: inline-flex; align-items: center; gap: 6px; height: 48px; padding: 0 14px; border-radius: 16px; background: var(--surface-2); border: 1.5px solid var(--line); font: 600 18px/1 var(--font-display); }
  .stars-total svg { width: 18px; height: 18px; fill: var(--primary); }
</style>
</head>
<body>
<div class="screen">
  <div class="nav">
    <span class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></span>
    <div class="title t-h1" style="font-size:26px">Hexa Fit</div>
    <span class="stars-total"><svg><use href="#star"/></svg>14</span>
  </div>

  <div class="card progress">
    <div class="row"><span class="t-label">Progreso</span><span class="t-body"><b style="font-family:var(--font-display); font-size:18px">6</b> <span style="color:var(--text-muted)">de 15 niveles · 14 de 45 ★</span></span></div>
    <div class="bar"><span></span></div>
  </div>

  <div class="comb" id="comb"></div>
  <div class="card" style="display:flex; gap:12px; align-items:center; padding:12px 14px; margin-bottom:10px">
    <span class="icon-btn" style="flex:none; background:rgba(180,124,255,0.18); border-color:var(--accent); color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v5h-5"/></svg></span>
    <span class="t-body" style="font-size:14px; color:var(--text-muted)">Cubre toda la figura con las piezas. Gíralas de 60° en 60°; puedes deshacer sin límite.</span>
  </div>
</div>
<div class="home-indicator"></div>

<script>
  // Level data for the mockup: stars per completed level, then the next level, then locked ones.
  const STARS = [3, 3, 2, 3, 1, 2];
  const NEXT = 7, TOTAL = 15;
  const HEX = "50,0 100,28.87 100,86.6 50,115.47 0,86.6 0,28.87";
  const star = on => `<svg style="fill:${on ? "var(--primary)" : "#3A4580"}"><use href="#star"/></svg>`;

  function tile(n) {
    if (n <= STARS.length) {
      const s = STARS[n - 1];
      return `<svg class="bg" viewBox="-4 -4 108 123.47"><polygon points="${HEX}" fill="var(--surface-2)" stroke="var(--accent)" stroke-opacity="0.55" stroke-width="3"/></svg>
              <span class="n">${n}</span><span class="stars">${star(s >= 1)}${star(s >= 2)}${star(s >= 3)}</span>`;
    }
    if (n === NEXT) {
      return `<svg class="bg" viewBox="-4 -4 108 123.47"><polygon points="${HEX}" fill="var(--primary)" stroke="#FFE27A" stroke-width="3"/></svg>
              <span class="n" style="color:var(--text-on-accent)">${n}</span><span class="t-label" style="position:relative; color:var(--text-on-accent); margin-top:5px">Jugar</span>`;
    }
    return `<svg class="bg" viewBox="-4 -4 108 123.47"><polygon points="${HEX}" fill="var(--surface)" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 6"/></svg>
            <svg style="position:relative" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B75AD" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="#6B75AD"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <span class="t-label" style="position:relative; color:#6B75AD; margin-top:2px">${n}</span>`;
  }

  // Honeycomb: rows of 3 and 2 alternate (3+2+3+2+3+2 = 15). Center line at 175 (screen 350 wide).
  document.addEventListener("DOMContentLoaded", () => {
    const comb = document.getElementById("comb");
    let n = 1, row = 0;
    while (n <= TOTAL) {
      const count = row % 2 === 0 ? 3 : 2;
      const xs = count === 3 ? [175 - 96, 175, 175 + 96] : [175 - 48, 175 + 48];
      for (const x of xs) {
        if (n > TOTAL) break;
        const el = document.createElement("div");
        el.className = "lvl" + (n === NEXT ? " next" : "");
        el.style.left = (x - 42) + "px";
        el.style.top = (8 + row * 80) + "px";
        el.innerHTML = tile(n++);
        comb.appendChild(el);
      }
      row++;
    }
  });
</script>
</body>
</html>
