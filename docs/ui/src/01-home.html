<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>01 · Inicio</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="screens.css">
<script src="hexgrid.js"></script>
<style>
  .top { display: flex; justify-content: space-between; padding-top: 8px; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .logo { filter: drop-shadow(0 0 28px rgba(180,124,255,0.45)); margin-bottom: 26px; }
  .name { font: 700 52px/0.95 var(--font-display); letter-spacing: 0.5px; }
  .suite { font: 700 20px/1 var(--font-display); letter-spacing: 12px; color: var(--primary); margin: 10px 0 0 12px; }
  .tagline { margin-top: 18px; color: var(--text-muted); }
  .actions { display: flex; flex-direction: column; gap: 14px; padding-bottom: 18px; }
  .actions .btn { width: 100%; height: 60px; font-size: 22px; }
  .resume { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .resume .txt { flex: 1; }
  .foot { text-align: center; padding-bottom: 6px; }
</style>
</head>
<body>
<div class="deco" style="top:110px; left:-34px" data-render="decoA"></div>
<div class="deco" style="top:520px; right:-40px" data-render="decoB"></div>

<div class="screen">
  <div class="top">
    <span class="icon-btn" title="Sonido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg></span>
    <span class="icon-btn" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.4" fill="var(--surface-2)"/><circle cx="15" cy="17" r="2.4" fill="var(--surface-2)"/></svg></span>
  </div>

  <div class="hero">
    <div class="logo" data-render="logo"></div>
    <div class="name">HexaBlock</div>
    <div class="suite">SUITE</div>
    <div class="t-body tagline">Cuatro juegos, un solo tablero.</div>
  </div>

  <div class="actions">
    <div class="card resume">
      <div data-render="resumeIcon"></div>
      <div class="txt"><div class="t-label">Continuar</div><div class="t-h2" style="font-size:19px">Hexa Fit · Nivel 7</div></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    </div>
    <span class="btn btn-primary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
      Jugar</span>
  </div>
  <div class="foot t-label">v1.0 · UCAB 2026-2</div>
</div>
<div class="home-indicator"></div>

<script>
  const V = ["var(--variant-lines)", "var(--variant-fit)", "var(--variant-sort)", "var(--variant-merge)", "var(--tile-red)", "var(--tile-green)"];
  function logo() {
    // A radius-1 flower: center in gold, ring in the four variant colors.
    const ring = { "0,0": "var(--primary)", "1,-1": "var(--variant-lines)", "1,0": "var(--variant-fit)", "0,1": "var(--variant-sort)",
                   "-1,1": "var(--tile-red)", "-1,0": "var(--merge-1024)", "0,-1": "var(--tile-green)" };
    return HB.board({ cells: HB.hexagon(1), size: 40, gap: 6, fill: (q, r) => ring[q + "," + r] });
  }
  function decoA() { return HB.board({ cells: [[0,0],[1,0],[0,1]], size: 34, gap: 6, fill: (q) => q ? "var(--variant-lines)" : "var(--variant-fit)" }); }
  function decoB() { return HB.board({ cells: [[0,0],[0,1],[-1,1]], size: 34, gap: 6, fill: () => "var(--variant-sort)" }); }
  function resumeIcon() { return HB.board({ cells: [[0,0],[1,0],[0,1]], size: 13, gap: 3, fill: () => "var(--variant-fit)" }); }
</script>
</body>
</html>
