<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>10 · Defeat (Hexa Lines)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="screens.css">
<script src="hexgrid.js"></script>
<style>
  body { --accent: var(--variant-lines);
    background: radial-gradient(460px 360px at 50% 30%, rgba(255,77,109,0.16), transparent 70%), var(--bg); }
  .head { text-align: center; margin-top: 28px; }
  .board { position: relative; display: flex; justify-content: center; margin-top: 24px; }
  .board > [data-render] { opacity: 0.5; filter: saturate(0.6); }
  .stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-6deg); padding: 10px 18px; border-radius: 14px;
    border: 3px solid var(--danger); color: var(--danger); font: 700 24px/1 var(--font-display); background: rgba(11,16,38,0.9); white-space: nowrap; box-shadow: 0 0 24px rgba(255,77,109,0.35); }
  .scores { display: flex; gap: 12px; margin-top: 24px; }
  .scores .card { flex: 1; padding: 16px; text-align: center; }
  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }
  .actions .btn { width: 100%; }
</style>
</head>
<body>
<div class="screen">
  <div class="head">
    <div class="t-label" style="color:var(--accent)">Hexa Lines</div>
    <div class="t-display" style="margin-top:10px">Sin espacio</div>
    <div class="t-body" style="color:var(--text-muted); margin-top:8px">Ninguna de tus piezas cabe en el tablero.</div>
  </div>

  <div class="board">
    <div data-render="board"></div>
    <span class="stamp">Fin de la partida</span>
  </div>

  <div class="scores">
    <div class="card"><div class="t-label">Puntaje</div><div class="t-number" style="margin-top:8px">1 248</div></div>
    <div class="card"><div class="t-label">Mejor</div><div class="t-number" style="margin-top:8px; color:var(--primary)">3 960</div></div>
  </div>

  <div class="actions">
    <span class="btn btn-primary"><span data-icon="retry" style="width:22px; height:22px; display:inline-flex"></span>Reintentar</span>
    <span class="btn btn-ghost"><span data-icon="home" style="width:20px; height:20px; display:inline-flex"></span>Inicio</span>
  </div>
</div>
<div class="home-indicator"></div>
<script>
  const C = ["var(--tile-red)", "var(--tile-orange)", "var(--tile-yellow)", "var(--tile-green)", "var(--tile-violet)", "var(--tile-cyan)"];
  function board() {
    // A crowded board. The 9 free cells are isolated (no two are neighbors), so no piece of 2+ cells fits,
    // and there is one on every row of all 3 axes, so no line is complete (LINES-1, LINES-2).
    const free = new Set(["-4,0", "-3,2", "-2,-1", "-1,3", "0,4", "1,-3", "2,1", "3,-2", "4,-4"]);
    return HB.board({ cells: HB.hexagon(4), size: 15.5, gap: 1.6, fill: (q, r) => free.has(q + "," + r) ? null : C[Math.abs(q * 3 + r * 5) % 6] });
  }
</script>
</body>
</html>
